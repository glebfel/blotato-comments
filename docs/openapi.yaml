openapi: 3.1.0
info:
  title: Comments API
  version: 0.1.0
  description: Comments on published posts across social platforms, and replies to them.
servers:
  - url: /v1
security:
  - apiKey: []
tags:
  - name: comments
paths:
  /posts/{postId}/comments:
    get:
      tags: [comments]
      summary: Top-level comments on a published post across all platforms
      parameters:
        - $ref: '#/components/parameters/postId'
        - $ref: '#/components/parameters/platform'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
        - name: sort
          in: query
          schema: { type: string, enum: [newest, oldest], default: newest }
      responses:
        '200':
          description: Comments and per-publication sync metadata
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Comment' }
                  meta:
                    type: object
                    required: [nextCursor, publications]
                    properties:
                      nextCursor: { type: [string, 'null'] }
                      publications:
                        type: array
                        items: { $ref: '#/components/schemas/Publication' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          {
            description: post_not_published,
            content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' } } },
          }
        '422': { $ref: '#/components/responses/Error' }
  /posts/{postId}/comments/sync:
    post:
      tags: [comments]
      summary: Pull fresh comments from the platform(s) now
      parameters:
        - $ref: '#/components/parameters/postId'
        - $ref: '#/components/parameters/platform'
        - name: mode
          in: query
          schema: { type: string, enum: [incremental, full] }
      responses:
        '200':
          description: Per-publication sync results (a failing publication is reported as status failed, not as an HTTP error)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/SyncResult' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          {
            description: post_not_published,
            content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' } } },
          }
        '429':
          {
            description: rate_limited,
            content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' } } },
          }
  /comments/{commentId}:
    get:
      tags: [comments]
      summary: One comment
      parameters:
        - $ref: '#/components/parameters/commentId'
      responses:
        '200':
          description: The comment
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Comment' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /comments/{commentId}/thread:
    get:
      tags: [comments]
      summary: Whole subtree under a comment (any depth), flat, oldest first
      parameters:
        - $ref: '#/components/parameters/commentId'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: Descendants of the comment
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Comment' }
                  meta:
                    type: object
                    properties:
                      nextCursor: { type: [string, 'null'] }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /comments/{commentId}/replies:
    get:
      tags: [comments]
      summary: Direct replies of a comment, oldest first
      parameters:
        - $ref: '#/components/parameters/commentId'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: Direct replies of the comment
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Comment' }
                  meta:
                    type: object
                    properties:
                      nextCursor: { type: [string, 'null'] }
        '404': { $ref: '#/components/responses/Error' }
    post:
      tags: [comments]
      summary: Reply to a comment as the account that owns the post
      parameters:
        - $ref: '#/components/parameters/commentId'
        - name: Idempotency-Key
          in: header
          required: true
          description: Unique per workspace. Repeating a request with the same key returns the stored outcome instead of posting again; reusing it with a different target or text is 422.
          schema: { type: string, maxLength: 255 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  {
                    type: string,
                    minLength: 1,
                    maxLength: 10000,
                    description: Validated again against the platform's own limit,
                  }
      responses:
        '201':
          description: Reply delivered to the platform
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Comment' }
        '200':
          description: Idempotent replay of an earlier request with the same key
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Comment' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          {
            description: reply_in_progress | reply_target_not_published | account_not_connected,
            content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' } } },
          }
        '422':
          {
            description: validation_error | platform_rejected | platform_not_supported,
            content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' } } },
          }
        '429':
          {
            description: platform_rate_limited (Retry-After when known),
            content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' } } },
          }
        '502':
          {
            description: platform_auth_error | platform_unavailable | platform_error,
            content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' } } },
          }
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
  parameters:
    postId:
      name: postId
      in: path
      required: true
      schema: { type: string, format: uuid }
    commentId:
      name: commentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    platform:
      name: platform
      in: query
      schema: { $ref: '#/components/schemas/Platform' }
    limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    cursor:
      name: cursor
      in: query
      description: Opaque cursor from a previous response's meta.nextCursor
      schema: { type: string }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
  schemas:
    Platform:
      type: string
      enum: [twitter, youtube, instagram, facebook, linkedin, tiktok, threads, pinterest, bluesky]
    Author:
      type: object
      properties:
        externalId: { type: [string, 'null'] }
        name: { type: [string, 'null'] }
        handle: { type: [string, 'null'] }
        avatarUrl: { type: [string, 'null'] }
    Comment:
      type: object
      required:
        [
          id,
          publicationId,
          platform,
          externalId,
          parentId,
          depth,
          author,
          isOwn,
          text,
          status,
          origin,
          replyCount,
          metrics,
          error,
          postedAt,
          syncedAt,
          createdAt,
        ]
      properties:
        id: { type: string }
        publicationId: { type: string }
        platform: { $ref: '#/components/schemas/Platform' }
        externalId: { type: [string, 'null'], description: Platform-side id; null while a reply is pending }
        parentId: { type: [string, 'null'], description: Local id of the parent comment; null for top-level }
        depth: { type: integer }
        author: { $ref: '#/components/schemas/Author' }
        isOwn: { type: boolean, description: Written by the connected account }
        text: { type: string }
        permalink: { type: [string, 'null'], description: Link to the comment on the platform }
        status: { type: string, enum: [published, pending, failed, deleted] }
        origin: { type: string, enum: [platform, app] }
        replyCount: { type: integer, description: Published direct replies known locally }
        metrics:
          type: object
          description: Platform counters; keys are likes and platformReplies today, adapters may add more
          properties:
            likes: { type: number }
            platformReplies: { type: number }
          additionalProperties: { type: number }
        error:
          type: [object, 'null']
          properties:
            code: { type: string }
            message: { type: string }
            retryable: { type: boolean, description: Whether repeating the same Idempotency-Key delivers again }
        postedAt: { type: string, format: date-time }
        syncedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    Publication:
      type: object
      properties:
        id: { type: string }
        postId: { type: string }
        platform: { $ref: '#/components/schemas/Platform' }
        socialAccountId: { type: string }
        externalPostId: { type: string }
        permalink: { type: [string, 'null'] }
        publishedAt: { type: string, format: date-time }
        sync:
          type: [object, 'null']
          properties:
            status: { type: string, enum: [idle, running, failed] }
            lastSyncedAt: { type: [string, 'null'], format: date-time }
            nextSyncAt: { type: [string, 'null'], format: date-time }
            lastError: { type: [string, 'null'] }
    SyncResult:
      type: object
      properties:
        publicationId: { type: string }
        status: { type: string, enum: [ok, skipped, aborted, failed] }
        reason: { type: [string, 'null'], enum: [sync_in_progress, recently_synced, lease_lost, null] }
        error:
          type: [object, 'null']
          description: Set when status is failed
          properties:
            code: { type: string }
            message: { type: string }
        fetched: { type: integer }
        created: { type: integer }
        updated: { type: integer }
        linked: { type: integer, description: Rows linked to their parent in this run }
        complete:
          { type: boolean, description: False when the per-run page cap was hit; the walk resumes on the next run }
    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, description: Stable code; platform failures are platform_<kind> }
            message: { type: string }
            details: { type: object, additionalProperties: true }
